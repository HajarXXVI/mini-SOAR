version: "3.9"
services:
  n8n:
    image: n8nio/n8n:latest
    platform: linux/arm64
    restart: always
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=UTC
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_SECURE_COOKIE=false
      - NODE_OPTIONS=--max-old-space-size=4096
      - N8N_BLOCK_BINARY_DATA_TTL=1
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - soc-net
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

volumes:
  n8n_data:

networks:
  soc-net:
    external: true
